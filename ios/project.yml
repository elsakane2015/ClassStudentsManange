name: SmartCampus
options:
  bundleIdPrefix: com.smartcampus
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_LANGUAGE: zh-Hans
    INFOPLIST_KEY_CFBundleDisplayName: "智慧校园"
    GENERATE_INFOPLIST_FILE: NO

targets:
  SmartCampus:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SmartCampus
        excludes:
          - "**/*.md"
    info:
      path: SmartCampus/Resources/Info.plist
      properties:
        CFBundleDisplayName: 智慧校园
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: 需要访问相机以拍摄请假证明或病历照片并上传至校园考勤系统。
        NSPhotoLibraryUsageDescription: 需要访问相册以选择请假证明图片并上传至校园考勤系统。
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: SmartCampus/Resources/SmartCampus.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        DEVELOPMENT_TEAM: HCDD4TQBT8
        PRODUCT_BUNDLE_IDENTIFIER: com.litotime.smartcampus
        PRODUCT_NAME: SmartCampus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: []
